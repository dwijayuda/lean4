name: Lean TS slim distribution experiment

on:
  push:
    branches: [experiment/lean-ts7-slim-dist-mvp]
    paths:
      - experiments/lean-ts-mvp/**
      - .github/workflows/lean-ts-slim-dist-mvp.yml
  workflow_dispatch:

jobs:
  slim-dist:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: experiments/lean-ts-mvp
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: experiments/lean-ts-mvp
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/lean-ts-mvp
          auto-config: false
          build: true
          use-github-cache: false
      - name: Inspect Lean 4.35 RC4 release layout and verify baseline
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Example.lean >/dev/null
          which lean
          elan which lean
          lean --version
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import os,subprocess
          lean=Path(subprocess.check_output(["elan","which","lean"],text=True).strip())
          root=lean.parent.parent
          print("root:",root,"resolve:",root.resolve())
          totals=defaultdict(lambda:[0,0])
          exts=defaultdict(lambda:[0,0])
          files=[]
          for p in root.rglob("*"):
            if p.is_file() and not p.is_symlink():
              b=p.stat().st_size
              rel=p.relative_to(root)
              grp="/".join(rel.parts[:2]) if len(rel.parts)>1 else str(rel)
              ext="".join(p.suffixes) or "(none)"
              totals[grp][0]+=b;totals[grp][1]+=1
              exts[ext][0]+=b;exts[ext][1]+=1
              files.append((b,str(rel)))
          print("BASELINE",sum(x[0] for x in totals.values()),"bytes",len(files),"files")
          print("LAYOUT");[print(f"{k} {v[0]/1048576:.1f} MiB {v[1]} files") for k,v in sorted(totals.items(),key=lambda x:-x[1][0])[:40]]
          print("EXTENSIONS");[print(f"{k} {v[0]/1048576:.1f} MiB {v[1]} files") for k,v in sorted(exts.items(),key=lambda x:-x[1][0])[:30]]
          print("TOP FILES");[print(f"{b/1048576:.1f} MiB {name}") for b,name in sorted(files,reverse=True)[:30]]
          print("BIN", sorted(str(p.name) for p in (root/"bin").iterdir())[:100])
          print("LIB", sorted(str(p.name) for p in (root/"lib").iterdir())[:100])
          print("LEAN_ROOT",sorted(str(p.name) for p in (root/"lib/lean").iterdir())[:100])
          print("PROJECT_ARTIFACTS",[str(p) for p in Path(".lake/build/lib/lean").rglob("*") if p.is_file()][:50])
          subprocess.run(["ldd",str(lean)],check=False)
          PY
