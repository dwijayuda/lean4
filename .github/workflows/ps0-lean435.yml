name: PS0 standalone Lean 4.35 stable native frontend

on:
  push:
    branches: [feature/ps0-lean435-stable-v1]
    paths:
      - experiments/ps0/**
      - .github/workflows/ps0-lean435.yml
  pull_request:
    branches: [experiment/pscv0-native-language-closure-v1]
    paths:
      - experiments/ps0/**
      - .github/workflows/ps0-lean435.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: experiments/ps0
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: experiments/ps0
          auto-config: false
          build: true
          use-github-cache: false
      - name: Validate v7 normative coverage without inventing PASS evidence
        run: |
          set -euo pipefail
          node scripts/validate-v7-coverage.mjs
          node scripts/report-language-progress.mjs
          if node scripts/validate-v7-coverage.mjs --require-complete > full-v7.log 2>&1; then
            echo "PS0 must not claim full v7 while cases remain pending"
            exit 1
          fi
          grep -F "v7 incomplete" full-v7.log
      - name: Prove PS0 is self-contained and compile exact Lean
        run: |
          set -euo pipefail
          test ! -e ../pscv0-lean-native
          if grep -R -E '^import PSCVL\.|^\[\[require\]\]' PS0 PS0.lean PS0Main.lean lakefile.toml; then
            echo "PS0 standalone source unexpectedly depends on PSCVL"
            exit 1
          fi
          lake build PS0 ps0
          lake env lean --version | tee lean-version.txt
          grep -F '4.35.0' lean-version.txt
          lake exe ps0 environment > stable-env.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("stable-env.json").read_text())
          expected=json.loads(Path("PS0_STANDARD_ENV.json").read_text())
          assert actual==expected, (actual,expected)
          assert actual["lean_commit"]=="eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          assert actual["lean_version"]=="4.35.0"
          print("PS0_STANDALONE_ENV: PASS")
          PY
      - name: Preserve unrestricted native Lean for .lean sources
        run: |
          set -euo pipefail
          # Native Lean must accept standard Lean constructs forbidden in .ps:
          # user axioms, unsafe/partial declarations, sorry, and IO #eval.
          lake exe ps0 check tests/lean/unrestricted.lean > lean-check.log 2>&1 || { cat lean-check.log; exit 1; }
          lake exe ps0 check tests/lean/instance_reference.lean > instance-reference.log 2>&1 || {
            cat instance-reference.log
            exit 1
          }
          lake exe ps0 check tests/lean/instance_priority_reference.lean > priority-reference.log 2>&1 || {
            cat priority-reference.log
            exit 1
          }
          lake exe ps0 check tests/lean/termination_reference.lean > termination-reference.log 2>&1 || {
            cat termination-reference.log
            exit 1
          }
          lake exe ps0 check tests/lean/termination_native_extensions.lean > native-termination.log 2>&1 || {
            cat native-termination.log
            exit 1
          }
          lake exe ps0 check tests/lean/v7_signature_reference.lean > signature-reference.log 2>&1 || {
            cat signature-reference.log
            exit 1
          }
          grep -F 'PS0_LEAN_UNRESTRICTED_OK' lean-check.log
          grep -F '42' lean-check.log
          lake exe ps0 lean tests/lean/unrestricted.lean > lean-native.log 2>&1 || { cat lean-native.log; exit 1; }
          grep -F 'PS0_LEAN_UNRESTRICTED_OK' lean-native.log
          lake exe ps0 build tests/lean/unrestricted.lean NativeUnrestricted build/lean-native > lean-build.log 2>&1 || { cat lean-build.log; exit 1; }
          test -s build/lean-native/NativeUnrestricted.olean
          test -s build/lean-native/NativeUnrestricted.c
          test -z "$(find build -type d -name '.ps0-lean-stage-*' -print -quit)"
          ! grep -F 'PSCV0-' lean-check.log
          echo 'PS0_NATIVE_LEAN_PROFILE_ISOLATION: PASS'
      - name: Check PS0 owned positive source cases
        run: |
          set -euo pipefail
          for file in tests/pass/*.ps; do
            echo "PS0_ACCEPT:$file"
            lake exe ps0 check "$file" > accepted.log 2>&1 || { cat accepted.log; exit 1; }
            grep -Fq 'UNCERTIFIED' accepted.log
            if [ "$file" = "tests/pass/eval_pure.ps" ]; then
              grep -F '42' accepted.log
            fi
          done
      - name: Check PS0 owned negative source cases
        run: |
          set -euo pipefail
          for file in tests/fail/*.ps; do
            echo "PS0_REJECT:$file"
            if lake exe ps0 check "$file" > rejected.log 2>&1; then
              cat rejected.log
              echo "PS0 accepted forbidden source: $file"
              exit 1
            fi
          done
          lake exe ps0 check tests/fail/ascii_bullet.ps > bullet.log 2>&1 && exit 1 || true
          grep -F "PSCV0-BULLET" bullet.log
          lake exe ps0 check tests/fail/typed_error_unbraced.ps > try.log 2>&1 && exit 1 || true
          grep -F "PSCV0-TRY-BRACES" try.log
          lake exe ps0 check tests/fail/eval_function.ps > eval.log 2>&1 && exit 1 || true
          grep -F "PSCV0-EVAL-TYPE" eval.log
          if lake exe ps0 check tests/fail/noncallable_empty.ps > empty.log 2>&1; then
            echo "PS0 incorrectly accepted an empty call on a Nat value"
            exit 1
          fi
          grep -F "PSCV0-CALL-EMPTY" empty.log
          # Ordered v7 binder groups may interleave with implicit/instance
          # groups, but two adjacent explicit comma-groups are forbidden.
          for fixture in adjacent_explicit_groups.ps native_def_adjacent_groups.ps native_theorem_adjacent_groups.ps; do
            if lake exe ps0 check "tests/fail/$fixture" > bind.log 2>&1; then
              echo "PS0 incorrectly accepted adjacent explicit binder groups: $fixture"
              exit 1
            fi
            grep -F "PSCV0-BIND-02" bind.log
          done
          if lake exe ps0 check tests/fail/do_iflet_arrow.ps > do-iflet.log 2>&1; then
            echo "PS0 incorrectly admitted deferred monadic do-if-let"
            exit 1
          fi
          grep -F "PSCV0-DO-IFLET-ARROW" do-iflet.log
          for pair in \
            'bodyless_opaque.ps:PSCV0-OPAQUE-BODY-REQUIRED' \
            'value_form_instance.ps:PSCV0-INSTANCE-VALUE-REFUSED'; do
            fixture="${pair%%:*}"
            diagnostic="${pair#*:}"
            if lake exe ps0 check "tests/fail/$fixture" > declaration.log 2>&1; then
              cat declaration.log
              exit 1
            fi
            grep -F "$diagnostic" declaration.log
          done
          # Each rejection must be for the claimed v7 language-policy rule.
          for pair in \
            'public_import_pending.ps:PSCV0-MODULE-PUBLIC-IMPORT-PENDING' \
            'module_header.ps:PSCV0-MODULE-HEADER-PENDING' \
            'prelude_header.ps:PSCV0-MODULE-PRELUDE-REFUSED' \
            'meta_import.ps:PSCV0-ENV-META-IMPORT-REFUSED' \
            'import_all.ps:PSCV0-ENV-IMPORT-ALL-REFUSED'; do
            fixture="${pair%%:*}"
            diagnostic="${pair#*:}"
            if lake exe ps0 check "tests/fail/$fixture" > classified.log 2>&1; then
              cat classified.log
              echo "PS0 accepted unsupported source: $fixture"
              exit 1
            fi
            grep -F "$diagnostic" classified.log
          done
      - name: V7 braced instance language acceptance
        run: |
          set -euo pipefail
          lake exe ps0 check tests/pass/instance_braced_fields.ps > instance-positive.log 2>&1 || {
            cat instance-positive.log
            exit 1
          }
          grep -F "UNCERTIFIED" instance-positive.log
          for pair in \
            'instance_fields_not_record.ps:PSCV0-INSTANCE-FIELDS' \
            'instance_unbraced_fields.ps:PSCV0-INSTANCE-BRACES'; do
            fixture="${pair%%:*}"
            reason="${pair#*:}"
            if lake exe ps0 check "tests/fail/$fixture" > instance-negative.log 2>&1; then
              cat instance-negative.log
              exit 1
            fi
            grep -F "$reason" instance-negative.log
          done
          lake exe ps0 check tests/pass/instance_priority.ps > priority-positive.log 2>&1 || {
            cat priority-positive.log
            exit 1
          }
          grep -F 'UNCERTIFIED' priority-positive.log
          for fixture in instance_priority_expression.ps instance_priority_unknown.ps; do
            if lake exe ps0 check "tests/fail/$fixture" > priority-negative.log 2>&1; then
              echo "PS0 accepted invalid priority: $fixture"
              cat priority-negative.log
              exit 1
            fi
          done
          echo 'PS0_INSTANCE_BRACED_FIELDS: PASS'
      - name: V7 well-founded total recursion semantic gate
        run: |
          set -euo pipefail
          lake exe ps0 check tests/pass/termination_total.ps > wf-positive.log 2>&1 || { cat wf-positive.log; exit 1; }
          grep -F 'UNCERTIFIED' wf-positive.log
          for fixture in termination_non_decreasing.ps termination_missing_measure.ps; do
            if lake exe ps0 check "tests/fail/$fixture" > wf-negative.log 2>&1; then
              echo "PS0 wrongly admitted $fixture"
              cat wf-negative.log
              exit 1
            fi
          done
          for rule in \
            'termination_native_structural.ps:PSCV0-TERM-01' \
            'termination_native_suggest.ps:PSCV0-TERM-01' \
            'termination_native_decreasing_without_measure.ps:PSCV0-TERM-01'; do
            fixture="${rule%%:*}"
            code="${rule#*:}"
            if lake exe ps0 check "tests/fail/$fixture" > native-term-negative.log 2>&1; then
              cat native-term-negative.log
              exit 1
            fi
            grep -F "$code" native-term-negative.log
          done
          echo 'PS0_TERMINATION_FAMILY: PASS'
      - name: Reject artifact emission for disallowed source
        run: |
          set -euo pipefail
          for file in tests/fail/sorry.ps tests/fail/unsafe.ps tests/fail/partial.ps tests/fail/axiom.ps tests/fail/function_state_false_spec.ps; do
            rm -rf build/rejected
            if lake exe ps0 build "$file" Rejected build/rejected > native-negative.log 2>&1; then
              cat native-negative.log
              exit 1
            fi
            test ! -e build/rejected/Rejected.olean
            test ! -e build/rejected/Rejected.c
            test ! -e build/rejected
            test -z "$(find build -type d -name '.ps0-stage-*' -print -quit)"
          done
      - name: Qualify native code and standalone linked executable
        run: |
          set -euo pipefail
          lake exe ps0 build tests/pass/native_math.ps NativeMath build/native
          test -s build/native/NativeMath.olean
          test -s build/native/NativeMath.c
          # Native C and olean are published only as one completed directory.
          test -z "$(find build -type d -name '.ps0-stage-*' -print -quit)"
          sha256sum build/native/NativeMath.olean build/native/NativeMath.c > published.sha256
          if lake exe ps0 build tests/pass/native_math.ps NativeMath build/native > overwrite.log 2>&1; then
            echo "PS0 must not overwrite an already qualified bundle"
            exit 1
          fi
          grep -F "PS0-OUTPUT-EXISTS" overwrite.log
          sha256sum -c published.sha256
          LAKE_PATH="$(lake env printenv LEAN_PATH)"
          LEAN_PATH="$PWD/build/native:$LAKE_PATH" lake env lean -c build/native/NativeHarness.c -o build/native/NativeHarness.olean tests/NativeHarness.lean
          lake build PS0:static
          PS0_LIB="$(find .lake/build/lib -maxdepth 1 -type f -name '*_PS0.a' -print -quit)"
          test -s "$PS0_LIB"
          lake env leanc -o build/native/ps0-native build/native/NativeMath.c build/native/NativeHarness.c "$PS0_LIB"
          build/native/ps0-native | grep -F PS0_NATIVE_OK
