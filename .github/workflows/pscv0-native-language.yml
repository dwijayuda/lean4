name: PSCV0 Lean 4.35 native language

on:
  push:
    branches: [experiment/pscv0-native-language-rc4, experiment/pscv0-native-language-closure-v1]
    paths:
      - experiments/pscv0-lean-native/**
      - .github/workflows/pscv0-native-language.yml
  workflow_dispatch:

concurrency:
  group: pscv0-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pscv0-native:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: experiments/pscv0-lean-native
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: experiments/pscv0-lean-native
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/pscv0-lean-native
          auto-config: false
          build: true
          use-github-cache: false
      - name: Build native ProofScript frontend
        run: |
          set -euo pipefail
          lake build PSCVL psc
          lake env lean --version
      - name: Validate pinned Standard environment identity
        run: |
          set -euo pipefail
          lake env .lake/build/bin/psc environment > emitted-environment.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          declared=json.loads(Path("PSCV0_STANDARD_ENV.json").read_text())
          compiled=json.loads(Path("emitted-environment.json").read_text())
          assert declared==compiled, (declared, compiled)
          assert compiled["lean_commit"]=="c29b6dda4f7c20e3eeaa717c4e565663c5cfa364"
          print("PSCV0_STANDARD_ENV_MATCH")
          PY
      - name: Check ProofScript source and Lean proofs
        run: |
          set -euo pipefail
          for file in tests/pass/*.ps; do
            echo "PSCV0_ACCEPT:$file"
            lake exe psc check "$file" > accepted.log 2>&1 || { cat accepted.log; exit 1; }
            grep -q UNCERTIFIED accepted.log
            if [ "$file" = "tests/pass/eval_pure.ps" ]; then
              grep -F "42" accepted.log
            fi
          done
      - name: Reject invalid source and proof terms
        run: |
          set -euo pipefail
          for file in tests/fail/*.ps; do
            echo "PSCV0_REJECT:$file"
            if lake exe psc check "$file" > rejected.log 2>&1; then
              cat rejected.log
              echo "invalid PSCV0 source accepted: $file"
              exit 1
            fi
          done
          if lake exe psc check tests/fail/ascii_bullet.ps > rejected-bullet.log 2>&1; then
            echo "PSCV0 unexpectedly accepted the ASCII proof bullet"
            exit 1
          fi
          grep -F "PSCV0-BULLET" rejected-bullet.log
          if lake exe psc check tests/fail/typed_error_unbraced.ps > rejected-try.log 2>&1; then
            echo "PSCV0 unexpectedly accepted a layout-only try/catch body"
            exit 1
          fi
          grep -F "PSCV0-TRY-BRACES" rejected-try.log
          if lake exe psc check tests/fail/eval_function.ps > rejected-eval.log 2>&1; then
            echo "PSCV0 unexpectedly evaluated a function-valued expression"
            exit 1
          fi
          grep -F "PSCV0-EVAL-TYPE" rejected-eval.log
      - name: Compile checked PSCV0 to Lean native executable
        run: |
          set -euo pipefail
          lake exe psc build tests/pass/native_math.ps NativeMath build/native
          test -s build/native/NativeMath.olean
          test -s build/native/NativeMath.c
          LAKE_PATH="$(lake env printenv LEAN_PATH)"
          LEAN_PATH="$PWD/build/native:$LAKE_PATH" lake env lean -c build/native/NativeHarness.c -o build/native/NativeHarness.olean tests/NativeHarness.lean
          lake build PSCVL:static
          ls -lh .lake/build/lib/*.a
          PSCV_LIB="$(find .lake/build/lib -maxdepth 1 -type f -name '*_PSCVL.a' -print -quit)"
          test -s "$PSCV_LIB"
          lake env leanc -o build/native/pscv-native build/native/NativeMath.c build/native/NativeHarness.c "$PSCV_LIB"
          build/native/pscv-native | grep -F PSCV0_NATIVE_OK
